[server]
# 💡 keepNodeClean은 더 이상 존재하지 않는 옵션이라 매 실행마다
# "not a valid config option" 경고를 찍고 있었다 — 제거.
# 웹소켓 압축을 해제하여 연결 드랍률을 낮춤
enableWebsocketCompression = false

[browser]
# 불필요한 통계 수집 통신을 꺼서 네트워크 리소스 확보
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[theme]
# 💡 라이트 고정. 기본값(base 미지정)은 브라우저/OS의 다크모드 설정을 따라가는데,
# 이 앱의 카드·배지 색이 밝은 배경 기준으로 잡혀 있어서 다크에서 글자가 묻혔다
# (수출입 탭 관련종목 배너가 흰 배경에 흰 글자로 안 보이던 사고가 있었다).
# 뷰어의 시스템 설정과 무관하게 항상 라이트로 렌더링한다.
base = "light"
# 💡 전체 글자 크기 16px → 14px (사용자 요청 2026-10-23, 휴대폰에서 글자가 커 보임).
# rem으로 잡힌 제목·입력창·선택창·캡션이 같은 비율로 줄어든다. px로 박은 카드 숫자 등은 그대로.
baseFontSize = 14
