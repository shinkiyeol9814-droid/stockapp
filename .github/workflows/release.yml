name: Auto Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        run: |
          # 이전 태그부터 현재 태그까지 커밋 목록 수집
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          TAG="${{ github.ref_name }}"

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges | head -30)
          fi

          # 💡 예전엔 여러 줄 문자열을 그대로 이어 썼는데, 그 줄들이 컬럼 0에
          # 있어서 `run: |` 블록 스칼라가 거기서 끊겼다. 특히 '---'가 YAML
          # 문서 구분자로 해석돼 이 워크플로우 파일 자체가 파싱 불가였고,
          # 그래서 태그를 밀어도 릴리즈가 만들어지지 않았다.
          # printf로 한 줄에 조립해 들여쓰기 문제를 원천 제거한다
          # (블록 안에서 줄을 들여쓰면 그 공백이 릴리즈 노트 본문에 그대로
          #  들어가 마크다운이 코드블록으로 잘못 렌더링된다).
          NOTES=$(printf '## 변경사항\n\n%s\n\n---\n*자동 생성된 릴리즈 노트*' "$COMMITS")

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES"
        env:
          GH_TOKEN: ${{ github.token }}
