name: Earnings Screening Auto Batch

on:
  repository_dispatch:
    types: [run_earnings_batch]
  workflow_dispatch:

# 💡 두 개의 배치가 겹치지 않게 — batch-state에 force 없이 쌓아 올리므로
# 동시에 돌면 서로의 커밋 위로 rebase 하느라 느려지기만 한다.
concurrency:
  group: "earnings-batch"
  cancel-in-progress: false # 돌고 있는 게 있으면 새 작업은 대기(skip)합니다.

jobs:
  run-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 💡 실적 데이터 전체(q_*.json · index.json · batch_config.json · last_sync.txt)가
      # 배포 브랜치(main)가 아니라 batch-state에 있다(2026-11-16). main에 두면 이 배치가
      # 30분마다 커밋하면서 Streamlit Cloud가 그때마다 앱을 재시작했다 — 평일 하루 20번이고,
      # 재시작 순간에 접속하면 인증 리디렉션이 꼬여 앱이 아예 안 열린다
      # (급등알림 상태·관심종목을 옮긴 것과 같은 이유, surge_batch.yml 주석 참고).
      # 클론은 저장 단계에서도 그대로 다시 쓴다.
      - name: Restore earnings state
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          URL="https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git"
          WORK="$RUNNER_TEMP/state"
          rm -rf "$WORK"
          git clone --depth 1 --branch batch-state "$URL" "$WORK" 2>/dev/null || {
            git clone --depth 1 "$URL" "$WORK"
            git -C "$WORK" checkout --orphan batch-state
            git -C "$WORK" rm -rf . >/dev/null 2>&1 || true
          }
          mkdir -p data/earnings "$WORK/data/earnings"
          cp "$WORK"/data/earnings/* data/earnings/ 2>/dev/null || true
          echo "복원: $(ls data/earnings/ | tr '\n' ' ')"

      - name: Check batch enabled flag
        id: check_flag
        run: |
          CONFIG_FILE="data/earnings/batch_config.json"
          if [ -f "$CONFIG_FILE" ]; then
            ENABLED=$(python3 -c "import json; print(json.load(open('$CONFIG_FILE'))['enabled'])")
            if [ "$ENABLED" = "False" ]; then
              echo "🛑 배치가 OFF 상태입니다. 스킵합니다."
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "✅ 배치가 ON 상태입니다. 실행합니다."
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "✅ 설정 파일 없음 — 기본 ON으로 실행합니다."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check_flag.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        if: steps.check_flag.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        if: steps.check_flag.outputs.skip != 'true'
        env:
          # 💡 [포인트] 이 배치는 정규식을 쓰기 때문에 GEMINI_API_KEY가 필요 없습니다!
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_SESSION_BATCH: ${{ secrets.TELEGRAM_SESSION_BATCH }}
          EARNINGS_CHANNEL: ${{ secrets.EARNINGS_CHANNEL }}
        run: python batch_earnings.py

      # 💡 main에는 아무것도 커밋하지 않는다 — 그게 이 구조의 전부다.
      - name: Save earnings state (off the deploy branch)
        if: steps.check_flag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          WORK="$RUNNER_TEMP/state"
          [ -d "$WORK/.git" ] || { echo "::error::복원 단계의 클론이 없습니다"; exit 1; }
          mkdir -p "$WORK/data/earnings"
          # ⚠️ **이 배치가 쓰는 파일만 되돌려 놓는다.** favorites.json·batch_config.json은
          # 같은 폴더에 있지만 주인이 앱이다 — 통째로 덮으면, 배치가 도는 몇 분 사이에
          # 사용자가 누른 별이나 ON/OFF가 복원 시점의 옛 값으로 되돌아간다.
          # 보관기간이 지나 배치가 지운 분기 파일은 저쪽에서도 지워야 한다(그냥 덮어쓰기만
          # 하면 batch-state에 영영 남는다).
          rm -f "$WORK"/data/earnings/q_*.json
          cp data/earnings/q_*.json data/earnings/index.json "$WORK/data/earnings/"
          if [ -f data/earnings/last_sync.txt ]; then
            cp data/earnings/last_sync.txt "$WORK/data/earnings/"
          fi
          git -C "$WORK" add -A data/earnings/
          git -C "$WORK" commit -m "Auto-update: AWAKE Earnings data" || { echo "변경 없음"; exit 0; }
          # batch-state는 급등알림·실적 배치와 앱(관심종목·배치 ON/OFF)이 같이 쓴다 — 받고 나서
          # 올리기 전에 다른 쪽이 먼저 올렸으면 거절되므로 위에 다시 얹어 다섯 번까지 재시도한다.
          # 파일이 서로 달라 내용 충돌은 안 나지만, 관심종목은 같은 폴더라 순서만 밀린다.
          for i in 1 2 3 4 5; do
            git -C "$WORK" push origin batch-state && { echo "push 성공 (시도 $i)"; exit 0; }
            git -C "$WORK" pull --rebase origin batch-state || git -C "$WORK" rebase --abort || true
            sleep $((i * 5))
          done
          echo "::error::push 실패 - 5회 재시도 후 포기"; exit 1
