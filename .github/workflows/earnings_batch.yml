name: Earnings Screening Auto Batch

on:
  repository_dispatch:
    types: [run_earnings_batch] 
  workflow_dispatch:

# 💡 [핵심 추가] 두 개의 배치가 겹치지 않게 철벽 방어!
concurrency:
  group: "earnings-batch"
  cancel-in-progress: false # 돌고 있는 게 있으면 새 작업은 대기(skip)합니다.

jobs:
  run-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check batch enabled flag
        id: check_flag
        run: |
          CONFIG_FILE="data/earnings/batch_config.json"
          if [ -f "$CONFIG_FILE" ]; then
            ENABLED=$(python3 -c "import json; print(json.load(open('$CONFIG_FILE'))['enabled'])")
            if [ "$ENABLED" = "False" ]; then
              echo "🛑 배치가 OFF 상태입니다. 스킵합니다."
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "✅ 배치가 ON 상태입니다. 실행합니다."
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "✅ 설정 파일 없음 — 기본 ON으로 실행합니다."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check_flag.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        if: steps.check_flag.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 수집 재개 지점(last_sync.txt)은 batch-state에 있다 — 아래 저장 단계 주석 참고.
      - name: Restore sync marker
        if: steps.check_flag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/earnings
          if curl -fsSL -H "Authorization: token $GH_TOKEN"                   -H "Accept: application/vnd.github.raw"                   "https://api.github.com/repos/${{ github.repository }}/contents/data/earnings/last_sync.txt?ref=batch-state"                   -o data/earnings/last_sync.txt; then
            echo "재개 지점 복원: $(cat data/earnings/last_sync.txt)"
          else
            rm -f data/earnings/last_sync.txt
            echo "::warning::batch-state에 재개 지점이 없어 배치 기본값으로 시작합니다"
          fi

      - name: Run Script
        if: steps.check_flag.outputs.skip != 'true'
        env:
          # 💡 [포인트] 이 배치는 정규식을 쓰기 때문에 GEMINI_API_KEY가 필요 없습니다!
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_SESSION_BATCH: ${{ secrets.TELEGRAM_SESSION_BATCH }}
          EARNINGS_CHANNEL: ${{ secrets.EARNINGS_CHANNEL }}
        run: python batch_earnings.py

      # 💡 last_sync.txt는 '언제까지 읽었나'를 기억하는 배치 전용 메모다 —
      # 앱은 읽지 않는다. 그런데 main에 있으면 30분마다 타임스탬프 한 줄이
      # 바뀌며 커밋이 생기고, 그 push가 Streamlit Cloud 재배포를 일으킨다.
      # 실적 데이터는 그대로인데 앱만 하루 20~30번 재시작했다.
      # 급등알림 상태와 같은 방식으로 batch-state 브랜치에 둔다.
      - name: Save sync marker (off the deploy branch)
        if: steps.check_flag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          [ -f data/earnings/last_sync.txt ] || { echo "마커 없음 — 건너뜀"; exit 0; }
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          URL="https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git"
          WORK="$RUNNER_TEMP/state"
          rm -rf "$WORK"
          git clone --depth 1 --branch batch-state "$URL" "$WORK" 2>/dev/null || {
            git clone --depth 1 "$URL" "$WORK"
            git -C "$WORK" checkout --orphan batch-state
            git -C "$WORK" rm -rf . >/dev/null 2>&1 || true
          }
          mkdir -p "$WORK/data/earnings"
          cp data/earnings/last_sync.txt "$WORK/data/earnings/last_sync.txt"
          git -C "$WORK" add data/earnings/last_sync.txt
          git -C "$WORK" commit -m "Earnings sync marker" || { echo "변경 없음"; exit 0; }
          git -C "$WORK" push origin batch-state

      - name: Commit and Push
        if: steps.check_flag.outputs.skip != 'true'
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          # 💡 예전엔 `git add data/` 로 data 폴더 전체를 담았다. 그러면 이 배치가
          # 만들지도 않은 다른 배치의 상태 파일(급등알림 alerted_today.json 등)까지
          # 커밋에 끌려들어와, 5분마다 도는 급등 배치와 불필요하게 충돌했다.
          # 이 배치가 실제로 쓰는 경로만 스테이징한다.
          # last_sync.txt는 위에서 batch-state로 보냈으므로 main에는 담지 않는다.
          git add data/earnings/
          git reset -q data/earnings/last_sync.txt 2>/dev/null || true
          git commit -m "Auto-update: AWAKE Earnings data" || { echo "No changes to commit"; exit 0; }
          # 💡 다른 배치가 그 사이 push 했으면 rebase 후 재시도한다.
          # 급등 배치가 5분 간격이라 몇 분 걸리는 배치는 경합이 흔하다.
          BR="${{ github.ref_name }}"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$BR" && git push origin "$BR"; then
              echo "push 성공 (시도 $i)"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::push 실패 - 5회 재시도 후 포기"; exit 1

