name: Keep Streamlit Alive

# 💡 curl은 소용이 없다. 앱이 잠들어도 URL은 정적 HTML 껍데기를 200으로 돌려주고,
# 파이썬 앱은 브라우저가 JS를 실행해 WebSocket을 맺어야 비로소 뜬다.
# 그래서 헤드리스 브라우저로 실제 접속하고, 잠들어 있으면 깨우기 버튼까지 누른다.
on:
  schedule:
    # 💡 Streamlit 측이 밝힌 절전 임계값은 12시간이다(7일 → 2~3일 → 12시간으로 계속 짧아졌다).
    # GitHub 스케줄은 지연·누락이 잦아서, 3시간 간격이면 두 번 연속 걸러도 9시간이라 여유가 있다.
    - cron: '0 */3 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/keep_alive.yml']
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Open the app in a real browser
        run: |
          python - <<'EOF'
          import re, sys
          from playwright.sync_api import sync_playwright

          URL = "https://stockapp-sky.streamlit.app/"
          MARKER = "가치평가"   # 앱 본문이 실제로 그려졌는지 확인할 문구

          with sync_playwright() as pw:
              browser = pw.chromium.launch()
              page = browser.new_page()
              page.goto(URL, wait_until="domcontentloaded", timeout=60_000)

              # 잠들어 있으면 "Yes, get this app back up!" 버튼이 나온다.
              try:
                  btn = page.get_by_role("button", name=re.compile("get this app back up", re.I))
                  btn.wait_for(timeout=8_000)
                  btn.click()
                  print("::notice::앱이 잠들어 있어 깨우기 버튼을 눌렀습니다")
              except Exception:
                  print("깨우기 버튼 없음 — 이미 깨어 있는 상태")

              try:
                  # 부팅에 시간이 걸린다. 이 문구가 보이면 WebSocket 세션까지 살아난 것.
                  page.wait_for_selector(f"text={MARKER}", timeout=180_000)
              except Exception:
                  print(f"::error::{URL} 에서 앱 본문('{MARKER}')을 확인하지 못했습니다")
                  page.screenshot(path="keep_alive_fail.png", full_page=True)
                  browser.close()
                  sys.exit(1)

              print(f"::notice::앱 정상 — '{MARKER}' 렌더링 확인")
              browser.close()
          EOF

      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-alive-failure
          path: keep_alive_fail.png
          if-no-files-found: ignore
