name: Keep Streamlit Alive

# 💡 curl은 소용이 없다. 앱이 잠들어도 URL은 정적 HTML 껍데기를 200으로 돌려주고,
# 파이썬 앱은 브라우저가 JS를 실행해 WebSocket을 맺어야 비로소 뜬다.
# 그래서 헤드리스 브라우저로 실제 접속하고, 잠들어 있으면 깨우기 버튼까지 누른다.
on:
  schedule:
    # 💡 Streamlit 측이 밝힌 절전 임계값은 12시간이다(7일 → 2~3일 → 12시간으로 계속 짧아졌다).
    # GitHub 스케줄은 지연·누락이 잦아서, 3시간 간격이면 두 번 연속 걸러도 9시간이라 여유가 있다.
    - cron: '0 */3 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/keep_alive.yml']
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # 💡 절전(잠듦)과 인증 리디렉션 루프(ERR_TOO_MANY_REDIRECTS)는 증상이 달라 따로 본다.
      # Streamlit Cloud는 앱 도메인 → share.streamlit.io/-/auth/app → 앱 도메인 순으로 쿠키를
      # 심는데, 이 사슬이 깨지면 쿠키를 허용해도 무한 반복이 돼 앱이 아예 안 열린다.
      # 쿠키를 막으면 루프가 나는 건 정상 동작이라(인증에 쿠키가 필요함) 쿠키를 켜고 확인한다.
      # 정상이면 리디렉션 3회 안쪽에 200으로 끝난다.
      - name: Check the auth redirect chain
        run: |
          JAR="$RUNNER_TEMP/keepalive_cookies.txt"
          OUT=$(curl -s -o /dev/null -m 60 -L --max-redirs 10 -c "$JAR" -b "$JAR" \
                 -w '%{http_code}|%{num_redirects}|%{url_effective}' \
                 https://stockapp-sky.streamlit.app/) || OUT="curl-error|0|-"
          CODE=${OUT%%|*}; REST=${OUT#*|}; HOPS=${REST%%|*}; FINAL=${REST#*|}
          echo "HTTP $CODE · 리디렉션 ${HOPS}회 · 최종 $FINAL"
          if [ "$CODE" != "200" ]; then
            echo "::error::인증 리디렉션이 끝나지 않았습니다 (HTTP $CODE, ${HOPS}회, 최종 $FINAL) — 브라우저에는 ERR_TOO_MANY_REDIRECTS로 보입니다"
            exit 1
          fi
          if [ "$HOPS" -ge 6 ]; then
            echo "::warning::리디렉션이 ${HOPS}회로 늘었습니다 (평소 3회) — 인증 흐름이 바뀌었을 수 있습니다"
          fi
          echo "::notice::인증 리디렉션 정상 (${HOPS}회 후 200)"

      - name: Open the app in a real browser
        run: |
          python - <<'EOF'
          import re, sys, time
          from playwright.sync_api import sync_playwright

          URL = "https://stockapp-sky.streamlit.app/"
          MARKER = "가치평가"                                  # 앱 본문이 그려졌는지 확인할 문구
          WAKE = re.compile("get this app back up", re.I)     # 잠든 앱의 깨우기 버튼

          def in_any_frame(page, fn):
              """앱은 루트 문서가 아니라 iframe(/~/+/) 안에 있다 — 프레임을 가리지 않고 찾는다."""
              for f in page.frames:
                  try:
                      hit = fn(f)
                      if hit:
                          return hit
                  except Exception:
                      pass
              return None

          with sync_playwright() as pw:
              browser = pw.chromium.launch()
              page = browser.new_page()
              page.goto(URL, wait_until="domcontentloaded", timeout=60_000)

              woke = ok = False
              deadline = time.time() + 240
              while time.time() < deadline:
                  if in_any_frame(page, lambda f: f.locator(f"text={MARKER}").count() > 0):
                      ok = True
                      break
                  if not woke:
                      btn = in_any_frame(page, lambda f: (f.get_by_role("button", name=WAKE).first
                                                          if f.get_by_role("button", name=WAKE).count() else None))
                      if btn:
                          btn.click()
                          woke = True
                          print("::notice::앱이 잠들어 있어 깨우기 버튼을 눌렀습니다")
                  page.wait_for_timeout(3_000)

              if not ok:
                  print(f"::error::앱 본문('{MARKER}')을 확인하지 못했습니다 (깨우기 시도: {woke})")
                  page.screenshot(path="keep_alive_fail.png", full_page=True)
                  browser.close()
                  sys.exit(1)

              page.wait_for_timeout(5_000)   # WebSocket 세션을 잠깐 유지
              print(f"::notice::앱 정상 — '{MARKER}' 확인" + (" (잠들어 있어 깨움)" if woke else ""))
              browser.close()
          EOF

      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-alive-failure
          path: keep_alive_fail.png
          if-no-files-found: ignore
