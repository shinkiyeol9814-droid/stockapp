name: Macro Commodity Price Batch (DRAM/DDR4/Lithium)

on:
  schedule:
    - cron: '0 9 * * 1-5'  # 월~금 한국시간 18:00
  repository_dispatch:
    types: [run_macro_batch]
  workflow_dispatch:

# 💡 동시 실행 방어. 이게 없어서 예정 실행(repository_dispatch)과
# 수동 실행이 겹치면 두 실행이 같은 날짜 파일을 각자 만들어
# push 단계에서 add/add 충돌로 죽었다 (실제로 발생함).
# earnings/surge 배치에는 원래 있던 설정을 나머지에도 맞춘다.
concurrency:
  group: "macro-batch"
  cancel-in-progress: false   # 돌고 있으면 새 작업은 대기

jobs:
  run-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # requests: 스팟 가격 스크래핑 / 나머지: 종목목록 시드 갱신(krx_listing.py)
          pip install requests pandas finance-datareader lxml html5lib

      - name: Run Script
        run: python batch_macro.py

      # 💡 가치평가/워치리스트가 쓰는 종목목록 시드를 매일 갱신한다.
      # 앱은 원격 소스가 전부 실패하면 이 파일로 폴백하므로, 이게 최신이어야
      # "장 마감 직후 검색 불가"가 재발하지 않는다. 상세 배경은 krx_listing.py.
      # 실패해도 배치 전체를 세우지 않는다(기존 시드가 남아 있으면 충분).
      - name: Refresh KRX listing seed
        continue-on-error: true
        run: python krx_listing.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          # 💡 예전엔 `git add data/` 로 data 폴더 전체를 담았다. 그러면 이 배치가
          # 만들지도 않은 다른 배치의 상태 파일(급등알림 alerted_today.json 등)까지
          # 커밋에 끌려들어와, 5분마다 도는 급등 배치와 불필요하게 충돌했다.
          # 이 배치가 실제로 쓰는 경로만 스테이징한다.
          git add data/macro/ data/listing/
          git commit -m "Auto-update: DRAM/DDR4/Lithium spot price & KRX listing" || { echo "No changes to commit"; exit 0; }
          # 💡 다른 배치가 그 사이 push 했으면 rebase 후 재시도한다.
          # 급등 배치가 5분 간격이라 몇 분 걸리는 배치는 경합이 흔하다.
          BR="${{ github.ref_name }}"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$BR" && git push origin "$BR"; then
              echo "push 성공 (시도 $i)"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::push 실패 - 5회 재시도 후 포기"; exit 1
