name: Stock Surge Alert Batch

on:
  # 💡 5분 간격처럼 짧은 주기는 GitHub 자체 schedule(cron)이 신뢰할 수 없어서
  # (부하 시 몇십 분씩 밀리거나 스킵됨) 다른 배치들과 같은 방식으로,
  # cron-job.org 같은 외부 스케줄러가 이 신호(run_surge_batch)를 호출하게 한다.
  repository_dispatch:
    types: [run_surge_batch]
  workflow_dispatch:

concurrency:
  group: "surge-batch"
  cancel-in-progress: false

jobs:
  run-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 💡 상태 파일은 배포 브랜치(main)가 아니라 batch-state 브랜치에 둔다.
      # 이 파일은 앱이 읽지 않는 '배치 전용 중복방지 목록'인데, main에 5분마다
      # 커밋되면서 Streamlit Cloud가 그때마다 앱을 재시작했다 — 장중 하루
      # 70회 이상이고, 재시작 순간에 접속하면 인증 리디렉션이 꼬여
      # ERR_TOO_MANY_REDIRECTS로 앱이 아예 안 열린다.
      # 실적 데이터(q_*.json)도 2026-11-16부터 batch-state에 있다 — 이 배치가
      # get_today_earnings_map()에서 읽는다. 클론 하나로 둘 다 가져오고, 저장
      # 단계에서도 같은 클론을 다시 쓴다. 4.4MB라 pip install 옆에서는 티도 안 난다.
      - name: Restore alert state
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          URL="https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git"
          WORK="$RUNNER_TEMP/state"
          rm -rf "$WORK"
          mkdir -p data/surge_alert data/earnings
          if git clone --depth 1 --branch batch-state "$URL" "$WORK" 2>/dev/null; then
            cp "$WORK"/data/surge_alert/alerted_today.json data/surge_alert/ 2>/dev/null || true
            cp "$WORK"/data/earnings/* data/earnings/ 2>/dev/null || true
            echo "복원: 실적 $(ls data/earnings/ | wc -l)개 파일"
          else
            git clone --depth 1 "$URL" "$WORK"
            git -C "$WORK" checkout --orphan batch-state
            git -C "$WORK" rm -rf . >/dev/null 2>&1 || true
            echo "::warning::batch-state가 없어 빈 상태로 시작합니다"
          fi
          # 브랜치나 파일이 없으면 빈 상태로 시작한다. 그날 알림이 한 번
          # 중복될 수 있을 뿐, 배치가 멈추지는 않는다.
          # (실적이 비면 get_today_earnings_map()이 빈 dict를 돌려줘 알림에 서프라이즈
          #  정보만 빠진다 — batch_surge_alert가 예외를 삼킨다.)
          [ -s data/surge_alert/alerted_today.json ] || echo '{}' > data/surge_alert/alerted_today.json

      - name: Run Script
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_SESSION_BATCH: ${{ secrets.TELEGRAM_SESSION_BATCH }}
          # 알림 대상 채팅 (초대 링크/@유저네임/채널 ID) — 코드에 하드코딩하지 않는다
          SURGE_ALERT_CHAT: ${{ secrets.SURGE_ALERT_CHAT }}
        run: python batch_surge_alert.py

      - name: Save alert state (off the deploy branch)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          WORK="$RUNNER_TEMP/state"      # 복원 단계가 만든 클론을 그대로 쓴다
          [ -d "$WORK/.git" ] || { echo "::error::복원 단계의 클론이 없습니다"; exit 1; }
          mkdir -p "$WORK/data/surge_alert"
          cp data/surge_alert/alerted_today.json "$WORK/data/surge_alert/alerted_today.json"
          git -C "$WORK" add data/surge_alert/alerted_today.json
          git -C "$WORK" commit -m "Surge alert state" || { echo "변경 없음"; exit 0; }
          # batch-state는 급등알림·실적 배치와 앱(관심종목 저장)이 같이 쓴다 — 받고 나서 올리기 전에
          # 다른 쪽이 먼저 올렸으면 거절되므로 위에 다시 얹어 세 번까지 재시도한다(파일이 서로 달라 충돌은 없다).
          for i in 1 2 3; do
            git -C "$WORK" push origin batch-state && exit 0
            git -C "$WORK" pull --rebase origin batch-state || true
          done
          exit 1
