name: Stock Surge Alert Batch

on:
  # 💡 5분 간격처럼 짧은 주기는 GitHub 자체 schedule(cron)이 신뢰할 수 없어서
  # (부하 시 몇십 분씩 밀리거나 스킵됨) 다른 배치들과 같은 방식으로,
  # cron-job.org 같은 외부 스케줄러가 이 신호(run_surge_batch)를 호출하게 한다.
  repository_dispatch:
    types: [run_surge_batch]
  workflow_dispatch:

concurrency:
  group: "surge-batch"
  cancel-in-progress: false

jobs:
  run-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_SESSION_BATCH: ${{ secrets.TELEGRAM_SESSION_BATCH }}
        run: python batch_surge_alert.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add data/surge_alert/
          git commit -m "Auto-update: Surge alert state" || echo "No changes to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin ${{ github.ref_name }}
