name: Stock Surge Alert Batch

on:
  # 💡 5분 간격처럼 짧은 주기는 GitHub 자체 schedule(cron)이 신뢰할 수 없어서
  # (부하 시 몇십 분씩 밀리거나 스킵됨) 다른 배치들과 같은 방식으로,
  # cron-job.org 같은 외부 스케줄러가 이 신호(run_surge_batch)를 호출하게 한다.
  repository_dispatch:
    types: [run_surge_batch]
  workflow_dispatch:

concurrency:
  group: "surge-batch"
  cancel-in-progress: false

jobs:
  run-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 💡 상태 파일은 배포 브랜치(main)가 아니라 batch-state 브랜치에 둔다.
      # 이 파일은 앱이 읽지 않는 '배치 전용 중복방지 목록'인데, main에 5분마다
      # 커밋되면서 Streamlit Cloud가 그때마다 앱을 재시작했다 — 장중 하루
      # 70회 이상이고, 재시작 순간에 접속하면 인증 리디렉션이 꼬여
      # ERR_TOO_MANY_REDIRECTS로 앱이 아예 안 열린다.
      - name: Restore alert state
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/surge_alert
          if curl -fsSL -H "Authorization: token $GH_TOKEN"                   -H "Accept: application/vnd.github.raw"                   "https://api.github.com/repos/${{ github.repository }}/contents/data/surge_alert/alerted_today.json?ref=batch-state"                   -o data/surge_alert/alerted_today.json; then
            echo "batch-state에서 상태 복원 ($(wc -c < data/surge_alert/alerted_today.json) bytes)"
          else
            # 브랜치나 파일이 없으면 빈 상태로 시작한다. 그날 알림이 한 번
            # 중복될 수 있을 뿐, 배치가 멈추지는 않는다.
            echo '{}' > data/surge_alert/alerted_today.json
            echo "::warning::batch-state에 상태가 없어 빈 상태로 시작합니다"
          fi

      - name: Run Script
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_SESSION_BATCH: ${{ secrets.TELEGRAM_SESSION_BATCH }}
          # 알림 대상 채팅 (초대 링크/@유저네임/채널 ID) — 코드에 하드코딩하지 않는다
          SURGE_ALERT_CHAT: ${{ secrets.SURGE_ALERT_CHAT }}
        run: python batch_surge_alert.py

      - name: Save alert state (off the deploy branch)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          URL="https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git"
          WORK="$RUNNER_TEMP/state"
          rm -rf "$WORK"
          git clone --depth 1 --branch batch-state "$URL" "$WORK" 2>/dev/null || {
            git clone --depth 1 "$URL" "$WORK"
            git -C "$WORK" checkout --orphan batch-state
            git -C "$WORK" rm -rf . >/dev/null 2>&1 || true
          }
          mkdir -p "$WORK/data/surge_alert"
          cp data/surge_alert/alerted_today.json "$WORK/data/surge_alert/alerted_today.json"
          git -C "$WORK" add data/surge_alert/alerted_today.json
          git -C "$WORK" commit -m "Surge alert state" || { echo "변경 없음"; exit 0; }
          # batch-state는 이 배치만 쓰므로 경합이 없다 — main처럼 rebase 재시도가 필요 없다.
          git -C "$WORK" push origin batch-state
