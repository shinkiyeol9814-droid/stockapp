name: Stock Surge Alert Batch

on:
  # 💡 5분 간격처럼 짧은 주기는 GitHub 자체 schedule(cron)이 신뢰할 수 없어서
  # (부하 시 몇십 분씩 밀리거나 스킵됨) 다른 배치들과 같은 방식으로,
  # cron-job.org 같은 외부 스케줄러가 이 신호(run_surge_batch)를 호출하게 한다.
  repository_dispatch:
    types: [run_surge_batch]
  workflow_dispatch:

concurrency:
  group: "surge-batch"
  cancel-in-progress: false

jobs:
  run-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_SESSION_BATCH: ${{ secrets.TELEGRAM_SESSION_BATCH }}
          # 알림 대상 채팅 (초대 링크/@유저네임/채널 ID) — 코드에 하드코딩하지 않는다
          SURGE_ALERT_CHAT: ${{ secrets.SURGE_ALERT_CHAT }}
        run: python batch_surge_alert.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          # 💡 예전엔 `git add data/` 로 data 폴더 전체를 담았다. 그러면 이 배치가
          # 만들지도 않은 다른 배치의 상태 파일(급등알림 alerted_today.json 등)까지
          # 커밋에 끌려들어와, 5분마다 도는 급등 배치와 불필요하게 충돌했다.
          # 이 배치가 실제로 쓰는 경로만 스테이징한다.
          git add data/surge_alert/
          git commit -m "Auto-update: Surge alert state" || { echo "No changes to commit"; exit 0; }
          # 💡 다른 배치가 그 사이 push 했으면 rebase 후 재시도한다.
          # 급등 배치가 5분 간격이라 몇 분 걸리는 배치는 경합이 흔하다.
          BR="${{ github.ref_name }}"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$BR" && git push origin "$BR"; then
              echo "push 성공 (시도 $i)"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::push 실패 - 5회 재시도 후 포기"; exit 1
