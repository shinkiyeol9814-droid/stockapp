name: DART Inventory & Backlog Batch

# Streamlit Cloud에서는 opendart.fss.or.kr 연결이 막혀(TCP 연결 시간 초과) 여기서 수집해
# data/dart/{종목코드}.json으로 커밋한다. 앱(ui_dart_panel)은 그 파일만 읽는다.
on:
  repository_dispatch:
    types: [run_dart_batch]      # 앱이 종목 조회 시 요청 — client_payload.codes
  schedule:
    - cron: '0 10 * * 1-5'       # 월~금 KST 19:00 — 워치리스트 전체
  push:
    branches: [main]
    paths: ['batch_dart.py', 'dart_fin.py', '.github/workflows/dart_batch.yml']
  workflow_dispatch:
    inputs:
      codes:
        description: '종목코드 (공백 구분). 비우면 워치리스트 전체'
        required: false
        default: ''

# 앱 요청 실행은 각자 그룹(run_id)이라 서로 취소되지 않는다(대기 실행이 취소되면 요청 종목이 누락).
# 워치리스트 실행끼리는 한 그룹 — 새 실행이 이전 실행을 대체해 DART에 대형 실행이 겹치지 않게 한다.
concurrency:
  group: dart-${{ github.event_name == 'repository_dispatch' && github.run_id || 'watchlist' }}
  cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests

      - name: Collect DART data
        timeout-minutes: 50
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          # 요청 값은 셸에 직접 끼워 넣지 않고 환경변수로만 넘긴다(스크립트 인젝션 방지).
          # 형식 검증은 batch_dart.py가 한다.
          CODES: ${{ github.event.client_payload.codes && toJSON(github.event.client_payload.codes) || github.event.inputs.codes }}
        run: |
          if [ -n "$CODES" ] && [ "$CODES" != "null" ]; then
            python batch_dart.py
          else
            python batch_dart.py --watchlist --max-minutes 40
          fi

      - name: Commit and Push
        if: always()   # 수집이 시간 초과·실패로 끝나도 그때까지 저장된 종목은 커밋한다
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          CHANGED=$(git status --porcelain --untracked-files=all -- data/dart | awk '{print $2}')
          if [ -z "$CHANGED" ]; then echo "No changes to commit"; exit 0; fi
          OUT="$RUNNER_TEMP/dart_out"
          mkdir -p "$OUT"
          for f in $CHANGED; do cp "$f" "$OUT/"; done
          # rebase 대신 최신 main 위에 이번 실행 파일만 덮어쓴다 — 앱 요청 실행과 같은 종목 파일을
          # 동시에 만들면 rebase가 add/add 충돌로 매번 실패해 수집 결과 전체를 잃었다.
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p data/dart
            cp "$OUT"/*.json data/dart/
            git add data/dart/
            if git diff --cached --quiet; then echo "No changes after sync"; exit 0; fi
            git commit -q -m "Auto-update: DART inventory & backlog"
            if git push -q origin HEAD:main; then
              echo "push 성공 (시도 $i, 파일 $(ls "$OUT" | wc -l)개)"; exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::push 실패 - 5회 재시도 후 포기"; exit 1
