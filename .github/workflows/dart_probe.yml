name: DART Connectivity Probe

# Streamlit Cloud에서 opendart.fss.or.kr 연결이 막혀(ConnectTimeout) DART 조회를
# GitHub Actions로 옮길 수 있는지 확인하는 점검용. 앱과 같은 dart_fin 코드를 돌린다.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dart_probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Probe DART
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python - <<'EOF'
          import os, socket, time
          import dart_fin as d

          # 결과는 annotation으로도 남긴다 — 공개 레포는 인증 없이 API로 읽을 수 있다.
          def report(title, msg, level="notice"):
              msg = str(msg).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::{level} title={title}::{msg}")

          key = os.environ.get("DART_API_KEY", "")
          report("key", f"DART_API_KEY 설정됨={bool(key)} 길이={len(key)}", "notice" if key else "error")
          if not key:
              raise SystemExit(1)

          t = time.time()
          try:
              socket.create_connection(("opendart.fss.or.kr", 443), timeout=10).close()
              report("TCP", f"opendart.fss.or.kr:443 연결 OK ({time.time() - t:.2f}s)")
          except Exception as e:
              report("TCP", f"연결 실패 {type(e).__name__} ({time.time() - t:.2f}s)", "error")

          def step(title, fn):
              t = time.time()
              try:
                  report(title, f"OK ({time.time() - t:.1f}s) {fn()}")
              except Exception as e:
                  report(title, f"FAIL ({time.time() - t:.1f}s) {type(e).__name__}: {d._redact(e)}", "error")

          def inv(code):
              rows = d.get_inventory_quarterly(code)["rows"]
              return f"{len(rows)}개 분기 / 최근 " + ", ".join(f"{r['기간']} {r['재고자산'] / 1e12:.2f}조" for r in rows[-3:])

          def reports(code):
              r = d.get_report_series(code)
              bl = r["backlog"]
              last = f"최신 {bl[-1]['기간']} {bl[-1]['수주잔고'] / 1e12:.2f}조" if bl else "없음"
              return f"수주잔고 {len(bl)}기간({last}) / 가동률 {len(r['util'])}기간 / 이상치 제외 {r['dropped']}"

          step("corp_map", lambda: f"상장사 {len(d.get_corp_map(force=True))}개")
          step("inventory 005930", lambda: inv("005930"))
          step("reports 329180", lambda: reports("329180"))
          EOF
